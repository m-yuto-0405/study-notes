name: 毎朝ニュース収集

on:
  schedule:
    - cron: '0 0 * * *'  # 毎朝9時JST (UTC 0:00)
  workflow_dispatch:       # 手動実行も可能

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: feedparser インストール
        run: pip install feedparser

      - name: ニュース収集
        run: python scripts/fetch-news.py

      - name: 変更をコミット&プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/news/
          git diff --cached --quiet || git commit -m "news: $(date +'%Y-%m-%d') のニュースを追加"
          git push
